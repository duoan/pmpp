[project]
name = "pmpp"
version = "0.0.0"
description = "Solutions and code for Programming Massively Parallel Processors (4th ed.)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "ninja",
    "pre-commit",
    "gradio",
    "cython",
    "h5py",
    "matplotlib>=3.10.9",
    "jaxtyping>=0.3.9",
    "cuda-tile[tileiras]>=1.3.0",
    "pytest>=9.0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
